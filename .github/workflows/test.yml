name: Cardist Interpreter Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Build Interpreter
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Run Lab 1 Tests
      run: python3 run_tests.py tests/lab1

    - name: Run Lab 2 Tests
      run: python3 run_tests.py tests/lab2